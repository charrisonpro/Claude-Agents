[package]
name = "project-team"
version = "1.0.0"
edition = "2021"
description = "Project Team CLI - Run PM, PE, or PC agents"

[dependencies]
tokio = { version = "1.35", features = ["full"] }
reqwest = { version = "0.11", features = ["json"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
regex = "1.10"
ratatui = "0.26"
crossterm = "0.27"
