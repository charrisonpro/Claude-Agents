[package]
name = "coach__personality__stem"
version = "0.1.0"
edition = "2021"
description = "A foundational coaching personality prompt focused on trust-building and open communication, designed to be specialized into different domains"

[dependencies]
tokio = { version = "1.35", features = ["full"] }
reqwest = { version = "0.11", features = ["json"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
regex = "1.10"
ratatui = "0.26"
crossterm = "0.27"
