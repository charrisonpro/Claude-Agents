[package]
name = "claude-agent"
version = "1.1.0"
edition = "2021"
description = "TUI-based Claude agent with file tools"

[dependencies]
tokio = { version = "1.35", features = ["full"] }
reqwest = { version = "0.11", features = ["json"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
regex = "1.10"
ratatui = "0.26"
crossterm = "0.27"

# Uses standard src/main.rs layout
